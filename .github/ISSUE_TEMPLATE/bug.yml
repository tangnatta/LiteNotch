name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LiteNotch version
      placeholder: 0.2.5
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      description: Say whether the display has a notch.
      placeholder: macOS 26.1, MacBook Pro 14" (notch)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Settings, screenshots, or logs
      description: Settings involved (notch style, theme, agent hooks…). For performance problems, paste the output of `scripts/bench.sh`.
