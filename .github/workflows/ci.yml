name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # Mondays: only `deny` runs

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress (macOS
# minutes are the expensive ones). Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@3f7c3597aa4e6da3f315e128de702ce61e7b2877 # cargo-llvm-cov
      - name: Tests with coverage (fails under 90 % lines)
        run: scripts/coverage.sh

  # Cheap and fast: RustSec advisories, licences, unknown sources. Also weekly,
  # because new advisories appear without any change here.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@d5b78900754d505a5f5f996e23d5f039b418e2f3 # cargo-deny
      - run: cargo deny check

  # `rust-version` in Cargo.toml must really build. `cargo check` only.
  msrv:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Oldest supported Rust
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" check --locked --workspace

  app:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the app bundle
        run: scripts/build-app.sh
      - name: Swift format
        run: swift format lint --strict --recursive macos/Sources macos/Tests
      - name: Shell tests
        run: swift test --package-path macos
      - name: Footprint budget
        run: scripts/bench.sh --check
      - name: Keep the app bundle
        run: ditto -c -k --keepParent dist/LiteNotch.app dist/LiteNotch-ci.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LiteNotch-app
          path: dist/LiteNotch-ci.zip
          retention-days: 14
