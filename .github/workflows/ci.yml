name: CI

on:
  push:
    branches: [main]
    # The release workflow's own cask commit needs no second run.
    paths-ignore: ["Casks/**"]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Tests with coverage (fails under 90 % lines)
        run: scripts/coverage.sh

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the app bundle
        run: scripts/build-app.sh
      - name: Shell tests
        run: swift test --package-path macos
      - name: Footprint budget
        run: scripts/bench.sh --check
      - name: Keep the app bundle
        run: ditto -c -k --keepParent dist/LiteNotch.app dist/LiteNotch-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LiteNotch-app
          path: dist/LiteNotch-ci.zip
          retention-days: 14

  cask:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cask syntax
        run: ruby -c Casks/litenotch.rb
