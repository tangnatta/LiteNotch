[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/files", "crates/app", "crates/cli"]

[workspace.package]
version = "0.2.0-beta.2"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
litenotch-core = { path = "crates/core" }
litenotch-platform = { path = "crates/platform" }
litenotch-files = { path = "crates/files" }
litenotch-app = { path = "crates/app" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
